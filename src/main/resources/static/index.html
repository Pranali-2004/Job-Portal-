<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal with AI Assistant</title>

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Color Emoji", sans-serif;
  background:#020617;
  color:white;
}

.navbar {
  display:flex;
  justify-content:space-between;
  padding:20px;
  background:#020617;
  flex-wrap:wrap;
}

.container {
  text-align:center;
  margin-top:120px;
  padding:0 20px;
}

.container h1 {
  font-size:2rem;
}

button {
  padding:12px 25px;
  margin:10px;
  border-radius:20px;
  border:none;
  cursor:pointer;
}

.user { background:#6366f1; color:white; }
.admin { background:#0ea5e9; color:white; }

@media (max-width: 600px) {
  .container {
    margin-top:80px;
  }
  .container h1 {
    font-size:1.5rem;
  }
  .navbar h2 {
    font-size:1.2rem;
  }
  button {
    width:80%;
    max-width:280px;
    display:block;
    margin:10px auto;
  }
}
</style>

</head>

<body>

<div class="navbar">	
  <h2>🚀 Job Portal with AI Assistant</h2>
</div>

<div class="container">
  <h1>Job Portal with Smart Assistance 🤖</h1>
<p>Apply for jobs and get guidance anytime</p>

  <button class="user" onclick="location.href='userLogin.html'">User Login</button>
  <button class="admin" onclick="location.href='adminLogin.html'">Admin</button>
</div>

</body>
</html>
